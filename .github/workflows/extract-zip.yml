name: Extract admin ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          zipfile="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [[ -z "$zipfile" ]]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Extracting: $zipfile"

          mkdir -p /tmp/chortke-admin-unpack
          unzip -o "$zipfile" -d /tmp/chortke-admin-unpack

          cp -a /tmp/chortke-admin-unpack/. .

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- README.md index.html supabase/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract CHORTKE admin panel files"
          git push
